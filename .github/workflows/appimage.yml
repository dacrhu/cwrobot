name: Build AppImage

# Builds the self-contained Linux AppImage (see packaging/build_appimage.sh
# and README.md) and attaches it to the GitHub Release for the pushed tag.
# workflow_dispatch is there too, for a manual "does the build still work"
# check without having to cut a real release tag.
on:
  push:
    tags:
      - "*" # tags in this repo are bare semver (e.g. "1.0.1"), no "v" prefix
  workflow_dispatch:

permissions:
  contents: write # needed to upload the built AppImage as a release asset

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags, not actions/checkout's default shallow
          # clone -- the release-notes step below needs `git log` between
          # the previous tag and this one.
          fetch-depth: 0

      - name: Build Hamlib (bundled into the AppImage) from source
        # Deliberately NOT `apt-get install libhamlib4` -- Ubuntu 24.04
        # ("noble", what ubuntu-latest currently is) ships Hamlib 4.5.5,
        # which is old enough to have real behavioral differences from
        # current Hamlib in rig_send_morse's CW-keyer path: confirmed in
        # the wild that a rig sending fine via a Fedora 43 (Hamlib 4.6.5)
        # system install of this same app hit persistent RIG_BUSBUSY
        # ("collision on the bus") failures on every send when using an
        # AppImage built against 4.5.5 instead -- not a timing race
        # (rig_client's own retry budget didn't help), a genuine
        # difference between those two Hamlib builds. Building the same
        # 4.6.5 release from source here keeps the bundled Hamlib in sync
        # with what's actually known to work, independent of whatever a
        # given Ubuntu LTS happens to package.
        env:
          HAMLIB_VERSION: "4.6.5"
        run: |
          sudo apt-get update
          # libegl1/libgl1/libxkbcommon0/libportaudio2: none of these are
          # Hamlib's dependencies -- the bare ubuntu-latest runner has no
          # graphics or audio stack at all, and the smoke-test step below
          # needs both. libegl1/libgl1/libxkbcommon0: PySide6/Qt6 needs
          # them even just to load under the "offscreen" platform plugin
          # (without them, `import PySide6.QtWidgets` fails with "libEGL.so.1:
          # cannot open shared object file"). libportaudio2: sounddevice's
          # PyPI wheel bundles its own PortAudio binary for Windows/macOS,
          # but NOT for Linux (PortAudio's Linux backends need to link
          # against the host's own ALSA/JACK/PulseAudio, so a portable
          # bundled .so isn't practical the same way) -- it dlopen()s the
          # system's libportaudio.so.2 instead, same as Hamlib does for
          # libhamlib.so. A real desktop Linux install almost always has
          # this already (pulled in by countless other audio apps), but the
          # bare CI runner doesn't, so `import sounddevice` failed with
          # "PortAudio library not found" here same as libEGL did.
          sudo apt-get install -y build-essential libusb-1.0-0-dev pkg-config curl \
            libegl1 libgl1 libxkbcommon0 libportaudio2

          curl -fL -o /tmp/hamlib.tar.gz \
            "https://github.com/Hamlib/Hamlib/releases/download/${HAMLIB_VERSION}/hamlib-${HAMLIB_VERSION}.tar.gz"
          mkdir -p /tmp/hamlib-src
          tar -xzf /tmp/hamlib.tar.gz -C /tmp/hamlib-src --strip-components=1

          ( cd /tmp/hamlib-src && ./configure --prefix=/usr/local --disable-static )
          make -C /tmp/hamlib-src -j"$(nproc)"
          sudo make -C /tmp/hamlib-src install
          sudo ldconfig

      - name: Install appimagetool
        # GitHub Actions runners have no FUSE, so appimagetool (itself
        # shipped as an AppImage) is run via its extracted AppRun instead
        # of executed directly -- the standard CI workaround for this.
        run: |
          curl -fL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          ( cd /tmp && ./appimagetool.AppImage --appimage-extract >/dev/null )
          sudo ln -s /tmp/squashfs-root/AppRun /usr/local/bin/appimagetool

      - name: Build the AppImage
        run: ./packaging/build_appimage.sh

      - name: Remove the runner's own PortAudio
        # build_appimage.sh already bundled a copy of it into the AppImage
        # (see that script's own comments for why sounddevice needs one
        # explicitly bundled, unlike Hamlib). Purging the runner's system
        # copy *before* the smoke test below means that step actually
        # proves the bundled CWROBOT_BUNDLED_PORTAUDIO fallback works, not
        # just that the AppImage happens to run fine on a runner that
        # coincidentally also has libportaudio2 installed system-wide.
        run: sudo apt-get remove -y libportaudio2

      - name: Smoke test
        # Actually runs the built AppImage headlessly and checks it starts
        # up and that the bundled Hamlib loads -- same check the
        # Windows/macOS jobs in windows-macos-build.yml run on their own
        # packages (see cwrobot.app's --smoke-test handling), added here
        # too for consistency: catches a broken bundle before it ships,
        # instead of only finding out from a user report.
        run: |
          chmod +x dist/CW_Robot-x86_64.AppImage
          export QT_QPA_PLATFORM=offscreen
          set +e
          # --appimage-extract-and-run: GitHub Actions runners have no
          # FUSE, so the AppImage can't mount itself the normal way.
          output="$(dist/CW_Robot-x86_64.AppImage --appimage-extract-and-run --smoke-test 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            echo "ERROR: smoke test exited with status $status" >&2
            exit 1
          fi
          echo "$output" | grep -q "Hamlib: loaded" || {
            echo "ERROR: smoke test did not report 'Hamlib: loaded' -- bundled Hamlib failed to load" >&2
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CW_Robot-x86_64.AppImage
          path: dist/CW_Robot-x86_64.AppImage

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        # GitHub's own --generate-notes is built around merged pull
        # requests (grouped by label, plus a "Full Changelog" diff link);
        # this repo is committed to directly instead, so that would come
        # out nearly empty. Building the notes from the commit log between
        # the previous tag and this one instead gives actual content
        # either way. `create` for a release that doesn't exist yet (the
        # common case: the tag push itself is what creates it), `edit` for
        # one that already does (e.g. created by hand on GitHub first).
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"

          {
            echo "## What's changed"
            echo
            if [ -n "${PREV_TAG}" ]; then
              git log --oneline --no-decorate "${PREV_TAG}..${GITHUB_REF_NAME}"
            else
              git log --oneline --no-decorate "${GITHUB_REF_NAME}"
            fi | sed 's/^/- /'
            if [ -n "${PREV_TAG}" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            fi
          } > /tmp/release-notes.md

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/CW_Robot-x86_64.AppImage --clobber
        env:
          GH_TOKEN: ${{ github.token }}
