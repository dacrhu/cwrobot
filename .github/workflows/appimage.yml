name: Build AppImage

# Builds the self-contained Linux AppImage (see packaging/build_appimage.sh
# and README.md) and attaches it to the GitHub Release for the pushed tag.
# workflow_dispatch is there too, for a manual "does the build still work"
# check without having to cut a real release tag.
on:
  push:
    tags:
      - "*" # tags in this repo are bare semver (e.g. "1.0.1"), no "v" prefix
  workflow_dispatch:

permissions:
  contents: write # needed to upload the built AppImage as a release asset

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags, not actions/checkout's default shallow
          # clone -- the release-notes step below needs `git log` between
          # the previous tag and this one.
          fetch-depth: 0

      - name: Install Hamlib (bundled into the AppImage) and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libhamlib4 libhamlib-dev curl

      - name: Install appimagetool
        # GitHub Actions runners have no FUSE, so appimagetool (itself
        # shipped as an AppImage) is run via its extracted AppRun instead
        # of executed directly -- the standard CI workaround for this.
        run: |
          curl -fL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          ( cd /tmp && ./appimagetool.AppImage --appimage-extract >/dev/null )
          sudo ln -s /tmp/squashfs-root/AppRun /usr/local/bin/appimagetool

      - name: Build the AppImage
        run: ./packaging/build_appimage.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CW_Robot-x86_64.AppImage
          path: dist/CW_Robot-x86_64.AppImage

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        # GitHub's own --generate-notes is built around merged pull
        # requests (grouped by label, plus a "Full Changelog" diff link);
        # this repo is committed to directly instead, so that would come
        # out nearly empty. Building the notes from the commit log between
        # the previous tag and this one instead gives actual content
        # either way. `create` for a release that doesn't exist yet (the
        # common case: the tag push itself is what creates it), `edit` for
        # one that already does (e.g. created by hand on GitHub first).
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"

          {
            echo "## What's changed"
            echo
            if [ -n "${PREV_TAG}" ]; then
              git log --oneline --no-decorate "${PREV_TAG}..${GITHUB_REF_NAME}"
            else
              git log --oneline --no-decorate "${GITHUB_REF_NAME}"
            fi | sed 's/^/- /'
            if [ -n "${PREV_TAG}" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            fi
          } > /tmp/release-notes.md

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/CW_Robot-x86_64.AppImage --clobber
        env:
          GH_TOKEN: ${{ github.token }}
