[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cwrobot"
dynamic = ["version"]
description = "CW Robot -- CW (Morse) transceiver desktop application"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6",
    "numpy",
    "scipy",
    "sounddevice",
    "pyserial",
]

[project.scripts]
cwrobot = "cwrobot.app:main"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.version]
# Single source of truth for the app version -- see src/cwrobot/__init__.py.
path = "src/cwrobot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cwrobot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
